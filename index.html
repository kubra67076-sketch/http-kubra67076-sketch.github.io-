<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Portfolio of Khatijatul Kubra - Software Engineer, Web Developer and Data Science Engineering student."
    >

    <meta
        name="author"
        content="Khatijatul Kubra"
    >

    <title>Khatijatul Kubra | Software Engineer & Web Developer</title>


    <style>

        /* =====================================
           GLOBAL
        ===================================== */

        :root {
            --bg: #f7f4ee;
            --bg-soft: #eee9df;
            --card: #ffffff;

            --text: #171717;
            --muted: #66625b;

            --accent: #c65d45;
            --accent-dark: #9e432f;

            --border: #ddd7cc;

            --shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);

            --max-width: 1150px;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);

            color: var(--text);

            line-height: 1.7;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        .container {
            width: 90%;

            max-width: var(--max-width);

            margin: auto;
        }


        /* =====================================
           NAVIGATION
        ===================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                rgba(247, 244, 238, 0.94);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid var(--border);
        }


        nav {

            min-height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .logo {

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -1px;
        }


        .logo span {
            color: var(--accent);
        }


        .
