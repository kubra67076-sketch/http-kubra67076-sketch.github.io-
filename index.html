<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khatijatul Kubra | Software Engineer & Web Developer</title>

    <meta name="description"
          content="Portfolio of Khatijatul Kubra - Software Engineer, Web Developer and aspiring technology professional.">

    <style>
        :root {
            --bg: #f7f4ee;
            --card: #fffdf8;
            --text: #171717;
            --muted: #6d6861;
            --accent: #c65d45;
            --accent-dark: #a94732;
            --border: #ded6c8;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: min(1120px, 90%);
            margin: auto;
        }

        /* NAVBAR */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(247, 244, 238, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.95rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

            min-height: 88vh;
            display: flex;
            align-items: center;
            padding: 80px 0;
        }

            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }
